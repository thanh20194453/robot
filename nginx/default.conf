server {
  listen 80;
  server_name _;

  # SPA
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # TODO: đổi IP backend theo môi trường của bạn
    proxy_pass http://192.168.0.252:8928;
  }

  # Nếu backend đáp ứng /api (không có dấu /)
  location = /api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://192.168.0.252:8928;
  }

  # Static assets cache (tuỳ chọn)
  location ~* \.(?:css|js|json|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public";
    try_files $uri $uri/ /index.html;
  }
}

